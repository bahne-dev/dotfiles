gpu-api=vulkan
vo=gpu-next
# ask Hyprland what the output wants: cm,hdr gets PQ passthrough,
# cm,srgb gets an SDR tone-map — one config for every display.sh mode
target-colorspace-hint=yes
# lock playback to the refresh rate (23.976 fps on a fixed 240 Hz)
video-sync=display-resample
gamma-auto=no
blend-subtitles=no
